<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Atelier Pro</title>
    <style>
        body { background-color: #ffffff; color: #000000; font-family: sans-serif; padding: 20px; text-align: center; }
        .pub-simple { background: #eeeeee; border: 1px solid #cccccc; padding: 10px; margin: 10px 0; font-size: 12px; }
        .btn-gros { display: block; width: 100%; max-width: 300px; margin: 15px auto; padding: 20px; font-size: 18px; font-weight: bold; background-color: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; }
        .btn-bloque { display: block; width: 100%; max-width: 300px; margin: 15px auto; padding: 20px; font-size: 18px; font-weight: bold; background-color: #e3342f; color: white; border: none; border-radius: 8px; cursor: pointer; }
        #zone-jeu { display: none; border: 2px solid #000000; margin-top: 20px; padding: 10px; }
        #mon-canvas { border: 1px solid red; background: #fafafa; display: block; margin: 10px auto; touch-action: none; }
    </style>
</head>
<body>

    <div class="pub-simple">=== ESPACE PUBLICITAIRE BANNER ===</div>

    <!-- ÉCRAN PRINCIPAL -->
    <div id="ecran-menu">
        <h1>Atelier Électricité Bâtiment Pro</h1>
        <p>Touchez un bouton ci-dessous pour tester le démarrage :</p>
        
        <button class="btn-gros" onclick="lancerNiveau(1)">DÉMARRER NIVEAU 1</button>
        <button class="btn-gros" onclick="lancerNiveau(2)">DÉMARRER NIVEAU 2</button>
        <button class="btn-gros" onclick="lancerNiveau(3)">DÉMARRER NIVEAU 3</button>
        
        <button class="btn-bloque" onclick="ouvrirOptionPayante()">🔒 NIVEAU 4 (PREMIUM)</button>
    </div>

    <!-- ÉCRAN DE JEU -->
    <div id="zone-jeu">
        <h2 id="titre-jeu">Niveau</h2>
        <p>Dessinez sur le rectangle ci-dessous avec votre doigt :</p>
        
        <canvas id="mon-canvas" width="300" height="200"></canvas>
        
        <button class="btn-gros" style="background-color: #28a745;" onclick="validerCablage()">⚡ VÉRIFIER LE CÂBLAGE</button>
        <button class="btn-gros" style="background-color: #6c757d;" onclick="quitterJeu()">⬅ RETOUR AU MENU</button>
    </div>

    <div class="pub-simple">=== ESPACE PUBLICITAIRE BANNER ===</div>

    <script>
        var canvas = document.getElementById('mon-canvas');
        var ctx = canvas.getContext('2d');
        var enTrainDeDessiner = false;

        // Fonction basique pour changer d'écran
        function lancerNiveau(num) {
            document.getElementById('ecran-menu').style.display = 'none';
            document.getElementById('zone-jeu').style.display = 'block';
            document.getElementById('titre-jeu').innerText = "Atelier Niveau " + num;
            
            // Initialisation rapide du canvas blanc
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#000000";
            ctx.font = "14px sans-serif";
            ctx.fillText("Borne A", 20, 100);
            ctx.fillText("Borne B", 220, 100);
        }

        function quitterJeu() {
            document.getElementById('zone-jeu').style.display = 'none';
            document.getElementById('ecran-menu').style.display = 'block';
        }

        function ouvrirOptionPayante() {
            alert("Système de Monétisation : Ce niveau requiert un abonnement Premium ou le visionnage d'une publicité.");
        }

        function validerCablage() {
            alert("Publicité Interstitielle de 5 secondes simulée... Validation réussie !");
            quitterJeu();
        }

        // Gestion du dessin tactile simplifiée au maximum pour éviter le gel
        function obtenirPositionTactile(e) {
            var rect = canvas.getBoundingClientRect();
            var t = e.touches[0];
            return { x: t.clientX - rect.left, y: t.clientY - rect.top };
        }

        canvas.addEventListener('touchstart', function(e) {
            enTrainDeDessiner = true;
            var pos = obtenirPositionTactile(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            e.preventDefault();
        }, {passive: false});

        canvas.addEventListener('touchmove', function(e) {
            if (!enTrainDeDessiner) return;
            var pos = obtenirPositionTactile(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.strokeStyle = "#ff0000"; // Fil rouge par défaut pour le test
            ctx.lineWidth = 4;
            ctx.stroke();
            e.preventDefault();
        }, {passive: false});

        window.addEventListener('touchend', function() {
            enTrainDeDessiner = false;
        });
    </script>
</body>
</html>
