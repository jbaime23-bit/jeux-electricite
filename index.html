<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu Électricité Bâtiment Pro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* Zone de Publicité Haute */
        #pub-banner-top {
            width: 728px;
            height: 90px;
            background-color: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
            border: 1px dashed #999;
        }
        /* Conteneur principal */
        .game-container {
            width: 800px;
            background: white;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            text-align: center;
        }
        /* Zone de dessin du circuit */
        #circuit-board {
            border: 2px solid #333;
            background-color: #fafafa;
            margin-top: 15px;
            cursor: crosshair;
        }
        .controls {
            margin-top: 15px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background-color: #007bff;
            color: white;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <!-- Emplacement Bannière Pub Adsterra / Google -->
    <div id="pub-banner-top">
        <span>Espace Publicitaire (728x90)</span>
    </div>

    <div class="game-container">
        <h1>Atelier Électricité : Le Simple Allumage</h1>
        <p>Objectif : Raccordez le disjoncteur, l'interrupteur et la lampe en respectant les couleurs des conducteurs.</p>
        
        <!-- Tableau de jeu interactif -->
        <canvas id="circuit-board" width="760" height="400"></canvas>

        <div class="controls">
            <button id="btn-verify">Vérifier le câblage</button>
            <button id="btn-reset" style="background-color: #dc3545;">Recommencer</button>
        </div>
    </div>

    <script>
        // La logique JavaScript et le moteur de vérification des connexions seront placés ici
        console.log("Jeu d'électricité initialisé.");
    </script>
</body>
</html>
