<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu Électricité Bâtiment Pro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #pub-banner-top {
            width: 100%;
            max-width: 728px;
            height: 90px;
            background-color: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
            border: 1px dashed #999;
        }
        .game-container {
            width: 95%;
            max-width: 800px;
            background: white;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }
        #circuit-board {
            border: 3px solid #333;
            background-color: #ffffff;
            margin-top: 15px;
            max-width: 100%;
            height: auto;
        }
        .color-selector {
            margin: 15px 0;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .color-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid #ccc;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .color-btn.active {
            border-color: #000;
            transform: scale(1.15);
        }
        .btn-phase { background-color: #cc0000; }
        .btn-neutre { background-color: #0000ff; }
        .btn-terre { background-color: #00cc00; } /* Vert/Jaune géré en dessin */
        
        .controls {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        button.action-btn {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            color: white;
        }
        #btn-verify { background-color: #28a745; }
        #btn-reset { background-color: #dc3545; }
        #status-message {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="pub-banner-top">
        <span>Espace Publicitaire (728x90)</span>
    </div>

    <div class="game-container">
        <h1>Niveau 1 : La Prise de Courant</h1>
        <p>Sélectionnez le bon conducteur et reliez les bornes correspondantes du Disjoncteur à la Prise.</p>
        
        <div class="color-selector">
            <div class="color-btn btn-phase active" onclick="selectColor('#cc0000', this)" title="Phase (Rouge)"></div>
            <div class="color-btn btn-neutre" onclick="selectColor('#0000ff', this)" title="Neutre (Bleu)"></div>
            <div class="color-btn btn-terre" onclick="selectColor('stripe', this)" title="Terre (Vert/Jaune)"></div>
        </div>

        <canvas id="circuit-board" width="760" height="400"></canvas>

        <div id="status-message">Tracez votre premier fil !</div>

        <div class="controls">
            <button id="btn-verify" class="action-btn" onclick="verifyCircuit()">Vérifier le câblage</button>
            <button id="btn-reset" class="action-btn" onclick="resetCanvas()">Recommencer</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('circuit-board');
        const ctx = canvas.getContext('2d');
        const statusMsg = document.getElementById('status-message');

        let isDrawing = false;
        let startTerminal = null;
        let currentWireColor = '#cc0000'; // Rouge par défaut
        let connections = []; // Stocke les connexions valides

        // Définition des bornes (Terminaux) du jeu
        const terminals = {
            // Bornes de départ (Disjoncteur à gauche)
            'D_L': { x: 150, y: 150, color: '#cc0000', connected: false, name: 'Phase Disjoncteur' },
            'D_N': { x: 150, y: 200, color: '#0000ff', connected: false, name: 'Neutre Disjoncteur' },
            'D_T': { x: 150, y: 250, color: 'stripe',  connected: false, name: 'Terre Protection' },
            // Bornes d'arrivée (Prise de courant à droite)
            'P_L': { x: 610, y: 150, color: '#cc0000', connected: false, name: 'Phase Prise' },
            'P_N': { x: 610, y: 200, color: '#0000ff', connected: false, name: 'Neutre Prise' },
            'P_T': { x: 570, y: 220, color: 'stripe',  connected: false, name: 'Terre Prise' }
        };

        function drawApparatus() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 1. DESSIN DU DISJONCTEUR (Module de gauche)
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 3;
            ctx.strokeRect(50, 80, 120, 240);
            ctx.fillStyle = '#f0f0f0';
            ctx.fillRect(50, 80, 120, 240);
            
            ctx.fillStyle = '#333';
            ctx.font = 'bold 14px Arial';
            ctx.fillText("DISJONCTEUR", 60, 110);
            
            // ÉTIQUETTES BORNES DISJONCTEUR
            ctx.font = '12px Arial';
            ctx.fillText("L (Phase)", 80, 154);
            ctx.fillText("N (Neutre)", 80, 204);
            ctx.fillText("PE (Terre)", 80, 254);

            // 2. DESSIN DE LA PRISE DE COURANT (Socle de droite)
            ctx.strokeRect(520, 100, 180, 200);
            ctx.fillStyle = '#fcfcfc';
            ctx.fillRect(520, 100, 180, 200);
            
            // Alvéoles de la prise
            ctx.beginPath();
            ctx.arc(610, 200, 45, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillStyle = '#ebebeb';
            ctx.fill();

            ctx.fillStyle = '#333';
            ctx.fillText("PRISE 2P+T", 575, 125);

            // Redessiner toutes les connexions déjà faites
            connections.forEach(wire => {
                drawWire(wire.start, wire.end, wire.color);
            });

            // Dessiner les points des bornes (plots de connexion)
            for (let key in terminals) {
                let t = terminals[key];
                ctx.beginPath();
                ctx.arc(t.x, t.y, 8, 0, Math.PI * 2);
                ctx.fillStyle = t.color === 'stripe' ? '#00cc00' : t.color;
                ctx.fill();
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        function drawWire(p1, p2, color) {
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.lineWidth = 5;
            
            if (color === 'stripe') {
                // Effet fil de Terre bicolore Vert et Jaune
                ctx.strokeStyle = '#00cc00';
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.setLineDash([10, 10]);
                ctx.strokeStyle = '#ffcc00';
                ctx.stroke();
                ctx.setLineDash([]); // Reset
            } else {
                ctx.strokeStyle = color;
                ctx.stroke();
            }
        }

        // Gestion du choix de couleur
        function selectColor(color, element) {
            currentWireColor = color;
            document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
        }

        // Détection du clic proche d'une borne
        function getTerminalAt(x, y) {
            for (let key in terminals) {
                let t = terminals[key];
                let dist = Math.hypot(t.x - x, t.y - y);
                if (dist < 15) return { key: key, obj: t };
            }
            return null;
        }

        // Événements souris et tactiles
        function getCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        function startDrawing(e) {
            const coords = getCoords(e);
            const term = getTerminalAt(coords.x, coords.y);
            if (term) {
                isDrawing = true;
                startTerminal = term;
            }
        }

        function stopDrawing(e) {
            if (!isDrawing) return;
            isDrawing = false;
            const coords = getCoords(e);
            const endTerminal = getTerminalAt(coords.x, coords.y);

            if (endTerminal && endTerminal.key !== startTerminal.key) {
                // Vérifier si la couleur du fil correspond à la borne de départ
                if (startTerminal.obj.color !== currentWireColor) {
                    statusMsg.innerText = "❌ Mauvaise couleur de fil pour cette borne !";
                    statusMsg.style.color = "#dc3545";
                } else {
                    // Ajouter la connexion
                    connections.push({
                        startId: startTerminal.key,
                        endId: endTerminal.key,
                        start: { x: startTerminal.obj.x, y: startTerminal.obj.y },
                        end: { x: endTerminal.obj.x, y: endTerminal.obj.y },
                        color: currentWireColor
                    });
                    statusMsg.innerText = "⚡ Connexion filaire effectuée.";
