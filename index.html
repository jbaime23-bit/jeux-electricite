<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeux Électricité - Accueil</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        p {
            font-size: 16px;
            color: #bdc3c7;
            margin-bottom: 40px;
            max-width: 400px;
            line-height: 1.5;
        }
        .menu-container {
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn-level {
            display: block;
            padding: 15px 20px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: #1abc9c;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: background-color 0.2s, transform 0.1s;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-level:active {
            background-color: #16a085;
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <h1>jeux-electricite</h1>
    <p>Jeu éducatif sur l'électricité bâtiment et le câblage domestique.</p>

    <!-- Liste des niveaux du jeu -->
    <div class="menu-container">
        <a href="prise.html" class="btn-level">Niveau 1 : Prise de Courant</a>
    </div>

</body>
</html>
